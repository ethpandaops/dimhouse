name: Build and Push Docker Images

# release/gloas variant: builds against the sigp/lighthouse glamsterdam devnet
# branch and publishes gloas-tagged images. Master keeps its own copy of this
# workflow tracking unstable.

on:
  push:
    branches:
      - release/gloas
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ethpandaops/dimhouse
  LIGHTHOUSE_REPO: sigp/lighthouse
  LIGHTHOUSE_BRANCH: glamsterdam-devnet-6

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.tag }}
      rolling: ${{ steps.version.outputs.rolling }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          ./scripts/dimhouse-build.sh -r "${{ env.LIGHTHOUSE_REPO }}" -b "${{ env.LIGHTHOUSE_BRANCH }}" --skip-build --ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version tag
        id: version
        run: |
          ROLLING=$(echo "${{ env.LIGHTHOUSE_BRANCH }}" | sed 's/glamsterdam/gloas/')
          echo "tag=${ROLLING}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "rolling=${ROLLING}" >> $GITHUB_OUTPUT

      - name: Build and push amd64 image
        run: |
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64

  build-arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.tag }}
      rolling: ${{ steps.version.outputs.rolling }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          ./scripts/dimhouse-build.sh -r "${{ env.LIGHTHOUSE_REPO }}" -b "${{ env.LIGHTHOUSE_BRANCH }}" --skip-build --ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Determine version tag
        id: version
        run: |
          ROLLING=$(echo "${{ env.LIGHTHOUSE_BRANCH }}" | sed 's/glamsterdam/gloas/')
          echo "tag=${ROLLING}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "rolling=${ROLLING}" >> $GITHUB_OUTPUT

      - name: Build and push arm64 image
        run: |
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifest
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
          ROLLING: ${{ needs.build-amd64.outputs.rolling }}
        run: |
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64"

          # Create version-specific manifest
          echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${AMD64_IMAGE} ${ARM64_IMAGE}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}

          # Rolling tag for the current gloas devnet
          echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}"
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING} \
            ${AMD64_IMAGE} ${ARM64_IMAGE}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}

      - name: Summary
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
          ROLLING: ${{ needs.build-amd64.outputs.rolling }}
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}\`" >> $GITHUB_STEP_SUMMARY
