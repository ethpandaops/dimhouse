name: Build and Push Docker Images

# master, releases and dispatches build lighthouse unstable or the dispatched
# lighthouse_ref. A network branch, whose network.env names it, builds that
# devnet's Lighthouse source and publishes <network> and <network>-<sha7>.
# Pushes to other branches build nothing.

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      lighthouse_ref:
        description: 'sigp/lighthouse branch or tag to build (needs patches/sigp/lighthouse/<ref>.patch), or daisugi-devnet-0 (scripts/prepare-daisugi-source.sh). Refs other than unstable get <ref>-<sha7> tags and never touch latest. Ignored on network branches.'
        required: false
        default: unstable
        type: string

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ethpandaops/dimhouse

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      repo: ${{ steps.plan.outputs.repo }}
      ref: ${{ steps.plan.outputs.ref }}
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      rolling: ${{ steps.plan.outputs.rolling }}
      backfill: ${{ steps.plan.outputs.backfill }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.lighthouse_ref }}
        run: |
          set -euo pipefail
          sha7=${GITHUB_SHA::7}
          if [ -f network.env ] && [ "$(sed -n 's/^NETWORK=//p' network.env)" == "$REF_NAME" ]; then
            source network.env
            if [[ ! "$LIGHTHOUSE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
              || [[ ! "$LIGHTHOUSE_REF" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ ]] \
              || [[ ! "$LIGHTHOUSE_COMMIT" =~ ^([0-9a-f]{40})?$ ]]; then
              echo "Invalid network.env" >&2
              exit 1
            fi
            # Devnet nodes don't backfill, so network branches skip the -backfill variant.
            {
              echo "build=true"
              echo "repo=$LIGHTHOUSE_REPO"
              echo "ref=$LIGHTHOUSE_REF"
              echo "commit=$LIGHTHOUSE_COMMIT"
              echo "version=$NETWORK-$sha7"
              echo "rolling=$NETWORK"
              echo "backfill=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" == "push" ] && [ "$REF_NAME" != "master" ]; then
            echo "Not master or a network branch: nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            ref=${INPUT_REF:-unstable}
            if [[ ! "$ref" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
              echo "Invalid lighthouse_ref: $ref" >&2
              exit 1
            fi
            if [ "$EVENT" == "release" ]; then
              version=$RELEASE_TAG
            elif [ "$ref" == "unstable" ]; then
              version=$sha7
            else
              version=$ref-$sha7
            fi
            # latest only tracks unstable builds from releases and master pushes
            rolling=
            if [ "$ref" == "unstable" ] && { [ "$EVENT" == "release" ] || [ "$GITHUB_REF" == "refs/heads/master" ]; }; then
              rolling=latest
            fi
            {
              echo "build=true"
              echo "repo=sigp/lighthouse"
              echo "ref=$ref"
              echo "commit="
              echo "version=$version"
              echo "rolling=$rolling"
              echo "backfill=true"
            } >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      backfill-digest: ${{ steps.push-backfill.outputs.digest }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        env:
          LIGHTHOUSE_REPO: ${{ needs.setup.outputs.repo }}
          LIGHTHOUSE_REF: ${{ needs.setup.outputs.ref }}
          LIGHTHOUSE_COMMIT: ${{ needs.setup.outputs.commit }}
        run: |
          if [ "$LIGHTHOUSE_REF" == "daisugi-devnet-0" ]; then
            ./scripts/prepare-daisugi-source.sh
          else
            ./scripts/dimhouse-build.sh -r "$LIGHTHOUSE_REPO" -b "$LIGHTHOUSE_REF" ${LIGHTHOUSE_COMMIT:+-c "$LIGHTHOUSE_COMMIT"} --skip-build --ci
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push amd64 image
        id: push
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Backfill-enabled variant: same build with the disable-backfill feature
      # left off (FEATURES empty), so historical block backfill and
      # --reconstruct-historic-states work. Used for archive nodes.
      - name: Build and push amd64 backfill image
        id: push-backfill
        if: needs.setup.outputs.backfill == 'true'
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false --build-arg FEATURES= -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-backfill-amd64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-backfill-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-arm64:
    needs: setup
    if: needs.setup.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      backfill-digest: ${{ steps.push-backfill.outputs.digest }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        env:
          LIGHTHOUSE_REPO: ${{ needs.setup.outputs.repo }}
          LIGHTHOUSE_REF: ${{ needs.setup.outputs.ref }}
          LIGHTHOUSE_COMMIT: ${{ needs.setup.outputs.commit }}
        run: |
          if [ "$LIGHTHOUSE_REF" == "daisugi-devnet-0" ]; then
            ./scripts/prepare-daisugi-source.sh
          else
            ./scripts/dimhouse-build.sh -r "$LIGHTHOUSE_REPO" -b "$LIGHTHOUSE_REF" ${LIGHTHOUSE_COMMIT:+-c "$LIGHTHOUSE_COMMIT"} --skip-build --ci
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push arm64 image
        id: push
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Backfill-enabled variant: same build with the disable-backfill feature
      # left off (FEATURES empty), so historical block backfill and
      # --reconstruct-historic-states work. Used for archive nodes.
      - name: Build and push arm64 backfill image
        id: push-backfill
        if: needs.setup.outputs.backfill == 'true'
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false --build-arg FEATURES= -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-backfill-arm64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-backfill-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  create-manifest:
    needs: [setup, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      ROLLING: ${{ needs.setup.outputs.rolling }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -o pipefail
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST}"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${ARM64_DIGEST}"
          PAIRS="${VERSION}-amd64@${AMD64_DIGEST} ${VERSION}-arm64@${ARM64_DIGEST}"

          for TAG in ${VERSION} ${ROLLING}; do
            echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG} \
              ${AMD64_IMAGE} ${ARM64_IMAGE}
            DIGEST=$(docker manifest push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" | tail -n1)
            PAIRS="${PAIRS} ${TAG}@${DIGEST}"
          done
          echo "pairs=${PAIRS}" >> "$GITHUB_OUTPUT"

      - name: Create backfill multi-arch manifest
        id: backfill
        if: needs.setup.outputs.backfill == 'true'
        env:
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.backfill-digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.backfill-digest }}
        run: |
          set -o pipefail
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST}"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${ARM64_DIGEST}"
          PAIRS="${VERSION}-backfill-amd64@${AMD64_DIGEST} ${VERSION}-backfill-arm64@${ARM64_DIGEST}"

          for TAG in ${VERSION} ${ROLLING}; do
            echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-backfill"
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-backfill \
              ${AMD64_IMAGE} ${ARM64_IMAGE}
            DIGEST=$(docker manifest push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-backfill" | tail -n1)
            PAIRS="${PAIRS} ${TAG}-backfill@${DIGEST}"
          done
          echo "pairs=${PAIRS}" >> "$GITHUB_OUTPUT"

      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: dimhouse
          tags: ${{ steps.manifest.outputs.pairs }} ${{ steps.backfill.outputs.pairs }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

      - name: Summary
        env:
          LIGHTHOUSE_SOURCE: ${{ needs.setup.outputs.repo }}@${{ needs.setup.outputs.ref }} ${{ needs.setup.outputs.commit }}
          BACKFILL: ${{ needs.setup.outputs.backfill }}
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Lighthouse source:** \`${LIGHTHOUSE_SOURCE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          for TAG in ${VERSION} ${ROLLING}; do
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}\`" >> $GITHUB_STEP_SUMMARY
            if [ "$BACKFILL" == "true" ]; then
              echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}-backfill\` (backfill + historic-state reconstruction enabled)" >> $GITHUB_STEP_SUMMARY
            fi
          done
