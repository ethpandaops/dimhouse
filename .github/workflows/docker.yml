name: Build and Push Docker Images

# release/gloas variant: builds against the sigp/lighthouse glamsterdam devnet
# branch and publishes gloas-tagged images. Master keeps its own copy of this
# workflow tracking unstable.

on:
  push:
    branches:
      - release/gloas
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ethpandaops/dimhouse
  LIGHTHOUSE_REPO: sigp/lighthouse
  LIGHTHOUSE_BRANCH: glamsterdam-devnet-8

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
      rolling: ${{ steps.version.outputs.rolling }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          ./scripts/dimhouse-build.sh -r "${{ env.LIGHTHOUSE_REPO }}" -b "${{ env.LIGHTHOUSE_BRANCH }}" --skip-build --ci

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine version tag
        id: version
        run: |
          ROLLING=$(echo "${{ env.LIGHTHOUSE_BRANCH }}" | sed 's/glamsterdam/gloas/')
          echo "tag=${ROLLING}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "rolling=${ROLLING}" >> $GITHUB_OUTPUT

      - name: Build and push amd64 image
        id: push
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-amd64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.tag }}
      rolling: ${{ steps.version.outputs.rolling }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare patched source
        run: |
          ./scripts/dimhouse-build.sh -r "${{ env.LIGHTHOUSE_REPO }}" -b "${{ env.LIGHTHOUSE_BRANCH }}" --skip-build --ci

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine version tag
        id: version
        run: |
          ROLLING=$(echo "${{ env.LIGHTHOUSE_BRANCH }}" | sed 's/glamsterdam/gloas/')
          echo "tag=${ROLLING}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "rolling=${ROLLING}" >> $GITHUB_OUTPUT

      - name: Build and push arm64 image
        id: push
        run: |
          set -o pipefail
          cd lighthouse
          docker build --provenance=false --sbom=false -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64 .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64 | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
          ROLLING: ${{ needs.build-amd64.outputs.rolling }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -o pipefail
          AMD64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${AMD64_DIGEST}"
          ARM64_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${ARM64_DIGEST}"
          PAIRS="${VERSION}-amd64@${AMD64_DIGEST} ${VERSION}-arm64@${ARM64_DIGEST}"

          # Create version-specific manifest
          echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${AMD64_IMAGE} ${ARM64_IMAGE}
          DIGEST=$(docker manifest push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" | tail -n1)
          PAIRS="${PAIRS} ${VERSION}@${DIGEST}"

          # Rolling tag for the current gloas devnet
          echo "Creating manifest: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}"
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING} \
            ${AMD64_IMAGE} ${ARM64_IMAGE}
          DIGEST=$(docker manifest push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}" | tail -n1)
          PAIRS="${PAIRS} ${ROLLING}@${DIGEST}"
          echo "pairs=${PAIRS}" >> "$GITHUB_OUTPUT"

      - name: Mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
        with:
          image: dimhouse
          tags: ${{ steps.manifest.outputs.pairs }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

      - name: Summary
        env:
          VERSION: ${{ needs.build-amd64.outputs.version }}
          ROLLING: ${{ needs.build-amd64.outputs.rolling }}
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${ROLLING}\`" >> $GITHUB_STEP_SUMMARY
